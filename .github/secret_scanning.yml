# Paths whose "secrets" are deliberately fake.
#
# This repository is a two-factor library, so it is full of strings shaped
# exactly like credentials: bot tokens, webhook secrets, HMAC peppers. Every one
# of them in the paths below is a placeholder, and several have to keep a
# credential's exact shape because the configuration validator rejects anything
# that does not — a test token must match ^\d+:[A-Za-z0-9_-]{30,}$ or the suite
# cannot construct a Config at all.
#
# Excluding these keeps the alert list meaningful. An alert that fires every
# time someone writes a test is an alert nobody reads, and the one that matters
# then arrives in a list of noise.
#
# Deliberately NOT excluded: packages/*/src, packages/go (its sources sit beside
# its tests), config files, and anything outside these paths. A real credential
# committed to source must still raise an alert.
paths-ignore:
  - "docs/**"
  - "packages/php/tests/**"
  - "packages/node/test/**"
  - "packages/ruby/test/**"
  - "packages/python/tests/**"
  - "packages/go/*_test.go"
  - "packages/go/**/*_test.go"
  - "conformance/**"
  - ".env.example"
