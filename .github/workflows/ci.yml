name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: packages/php

    # A real Redis, because the adapter's central claim — that one code is
    # consumed once across processes — rests on a lock being shared between
    # them, and an in-process lock trivially is not. The integration suite
    # skips itself when REDIS_HOST is unset, so this service is what keeps it
    # from being permanently skipped.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, redis, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Lint every source file
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 15
        run: vendor/bin/phpunit

      - name: Fail if the live-store integration suite was skipped
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 15
        run: |
          # A guarantee that rests on a skipped test is not a guarantee. If
          # this suite stops running, that must break the build rather than
          # pass quietly.
          if vendor/bin/phpunit --filter RedisCacheCodeStoreTest --no-coverage | grep -qiE 'skipped|no tests'; then
            echo "::error::The live Redis integration suite did not run."
            exit 1
          fi

      - name: Fail if the cross-language interop suites were skipped
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 15
        run: |
          # This is the suite that checks the bytes on the wire, which is the
          # one thing the /conformance fixtures cannot: they seed an in-memory
          # store, so they pass whatever the production adapter does to a value
          # on its way to Redis. If it stops running, the claim that the
          # implementations share a store is untested again.
          #
          # Not a blanket check for "skipped": a couple of tests skip by design
          # depending on the server and client build. More than that means the
          # suites did not really run - most likely every test skipped because
          # Redis was unreachable, which is the failure this guard exists for.
          # Both suites: RedisInteropTest covers the wire format and the
          # atomicity, LaravelRedisCommandsTest covers the adapter the service
          # provider actually wires. The first version of this only had the
          # former, and every write through the default path was broken.
          # Captured rather than run plainly, so the skip count can be read out
          # of it. The || keeps a genuine test failure from killing the step
          # before the output is echoed, which would leave a red X and no
          # explanation anywhere.
          FAILED=0
          OUTPUT=$(vendor/bin/phpunit --filter 'RedisInteropTest|LaravelRedisCommandsTest' --no-coverage --display-skipped) || FAILED=1
          echo "$OUTPUT"

          if [ "$FAILED" = "1" ]; then
            echo "::error::The cross-language interop suites failed."
            exit 1
          fi

          # The || true matters. A clean run prints no "Skipped:" line at all,
          # so grep finds nothing and exits 1 - and a failing command
          # substitution is the assignment's own exit status, which under the
          # bash -e that Actions runs these steps with kills the step. This
          # guard's first version failed precisely when everything passed.
          SKIPPED=$(echo "$OUTPUT" | grep -oE 'Skipped: [0-9]+' | tail -1 | grep -oE '[0-9]+' || true)
          SKIPPED=${SKIPPED:-0}

          # Two skips are legitimate between them: the GETDEL path needs Redis
          # 6.2, and the compression check needs an LZF-capable phpredis.
          if echo "$OUTPUT" | grep -qi 'no tests' || [ "$SKIPPED" -gt 2 ]; then
            echo "::error::The cross-language Redis interop suite did not run ($SKIPPED skipped)."
            exit 1
          fi

  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Test
        # No install step: the package has no runtime dependencies and the
        # suite uses the standard library's unittest, so there is nothing to
        # resolve and nothing to go stale.
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s . -t . -v

      - name: Check it imports from a built wheel
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist
          python -m pip install --quiet dist/*.whl
          cd /tmp && python -c "import kampe_telegram_2fa as k; print(k.__version__)"

  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.21', '1.22', '1.23']
    defaults:
      run:
        working-directory: packages/go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: packages/go/go.sum

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test under the race detector
        # The strongest concurrency check in the repository, and the reason
        # this job exists in addition to `go test`: the detector reports
        # unsynchronised access directly, rather than waiting for a bad
        # interleaving to happen to occur.
        run: go test -race ./...

  ruby:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4']
    defaults:
      run:
        working-directory: packages/ruby
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Lint every source file
        run: find lib test -name '*.rb' -print0 | xargs -0 -n1 ruby -c > /dev/null

      # Warnings on, because the suite runs real threads and Ruby reports
      # several kinds of mistake only as a warning.
      - name: Test
        run: rake test

      - name: Build the gem
        run: gem build kampe-telegram_2fa.gemspec

  # The protocol is only worth having if nothing leaks the thing it protects.
  # This fails the build on the mistakes that are easiest to reintroduce.
  secrets-hygiene:
    name: No codes in logs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject logging a raw update body
        run: |
          if grep -rniE "log[^(]*\(.*(update|request)->all\(\)" \
               --include='*.php' --include='*.ts' --include='*.py' packages/*/src; then
            echo "::error::A raw Telegram update must never be logged: it contains the codes."
            exit 1
          fi

      - name: Reject logging a code
        run: |
          if grep -rniE "(log|console)[^(]*\([^)]*['\"]code['\"][[:space:]]*(=>|:)" \
               --include='*.php' --include='*.ts' --include='*.py' packages/*/src; then
            echo "::error::A verification code must never be written to a log."
            exit 1
          fi

      - name: Reject non-constant-time comparison of code material
        run: |
          if grep -rnE '[$](storedHash|storedCode|hash|code)[[:space:]]*={2,3}[[:space:]]*[$]' \
               --include='*.php' packages/*/src; then
            echo "::error::Compare code hashes with hash_equals, not == or ===."
            exit 1
          fi

      - name: Reject predictable randomness
        run: |
          if grep -rnE '(mt_rand|[^_a-z]rand)[[:space:]]*\(|Math\.random[[:space:]]*\(' \
               --include='*.php' --include='*.ts' packages/*/src; then
            echo "::error::Use a CSPRNG: random_int, or node:crypto randomInt."
            exit 1
          fi

      - name: Reject Python's seeded random
        run: |
          # `import random` in a security path is the same mistake as mt_rand:
          # a Mersenne Twister's output is predictable from prior samples.
          if grep -rnE '^[[:space:]]*(import random|from random import)' \
               --include='*.py' packages/*/src; then
            echo "::error::Use the secrets module, not random."
            exit 1
          fi

      - name: Reject Go's seeded random
        run: |
          # math/rand in a security path is the same mistake as mt_rand: a
          # seeded generator's output is predictable from prior samples.
          if grep -rn '"math/rand"' --include='*.go' packages/go; then
            echo "::error::Use crypto/rand, not math/rand."
            exit 1
          fi

      # Ruby keeps its sources in lib/, so the globs above do not reach it.
      - name: Reject predictable randomness in Ruby
        run: |
          # The second alternative must not match SecureRandom, hence the
          # explicit non-word character before Random.
          if grep -rnE '(^|[^.[:alnum:]_])rand[[:space:]]*[(0-9]|(^|[^[:alnum:]_])Random\.' \
               --include='*.rb' packages/ruby/lib; then
            echo "::error::Use SecureRandom. Kernel#rand and Random are Mersenne Twisters, so their output is predictable from prior samples."
            exit 1
          fi

      - name: Reject non-constant-time comparison of code material in Ruby
        run: |
          if grep -rnE '(stored_hash|expected)[[:space:]]*={2}[[:space:]]*(actual|hash\()' \
               --include='*.rb' packages/ruby/lib; then
            echo "::error::Compare code hashes with OpenSSL.secure_compare, not ==."
            exit 1
          fi

      - name: Reject logging a code in Ruby
        run: |
          if grep -rniE '(logger|puts|warn)[^(]*\([^)]*(code:|"code")' \
               --include='*.rb' packages/ruby/lib; then
            echo "::error::A verification code must never be written to a log."
            exit 1
          fi
