name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: packages/php

    # A real Redis, because the adapter's central claim — that one code is
    # consumed once across processes — rests on a lock being shared between
    # them, and an in-process lock trivially is not. The integration suite
    # skips itself when REDIS_HOST is unset, so this service is what keeps it
    # from being permanently skipped.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, redis, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Lint every source file
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 15
        run: vendor/bin/phpunit

      - name: Fail if the live-store integration suite was skipped
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 15
        run: |
          # A guarantee that rests on a skipped test is not a guarantee. If
          # this suite stops running, that must break the build rather than
          # pass quietly.
          if vendor/bin/phpunit --filter RedisCacheCodeStoreTest --no-coverage | grep -qiE 'skipped|no tests'; then
            echo "::error::The live Redis integration suite did not run."
            exit 1
          fi

  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  dotnet:
    name: .NET ${{ matrix.dotnet }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ['8.0.x', '9.0.x']
    defaults:
      run:
        working-directory: packages/dotnet
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Restore
        run: dotnet restore

      # The projects already set TreatWarningsAsErrors; this is here so a change
      # that relaxes it in one project still fails the build.
      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Pack
        run: dotnet pack Kampe.TelegramTwoFactor/Kampe.TelegramTwoFactor.csproj --no-build --configuration Release --output ./artifacts

  # The protocol is only worth having if nothing leaks the thing it protects.
  # This fails the build on the mistakes that are easiest to reintroduce.
  secrets-hygiene:
    name: No codes in logs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject logging a raw update body
        run: |
          if grep -rniE "log[^(]*\(.*(update|request)->all\(\)" \
               --include='*.php' --include='*.ts' packages/*/src; then
            echo "::error::A raw Telegram update must never be logged: it contains the codes."
            exit 1
          fi

      - name: Reject logging a code
        run: |
          if grep -rniE "(log|console)[^(]*\([^)]*['\"]code['\"][[:space:]]*(=>|:)" \
               --include='*.php' --include='*.ts' packages/*/src; then
            echo "::error::A verification code must never be written to a log."
            exit 1
          fi

      - name: Reject non-constant-time comparison of code material
        run: |
          if grep -rnE '[$](storedHash|storedCode|hash|code)[[:space:]]*={2,3}[[:space:]]*[$]' \
               --include='*.php' packages/*/src; then
            echo "::error::Compare code hashes with hash_equals, not == or ===."
            exit 1
          fi

      - name: Reject predictable randomness
        run: |
          if grep -rnE '(mt_rand|[^_a-z]rand)[[:space:]]*\(|Math\.random[[:space:]]*\(' \
               --include='*.php' --include='*.ts' packages/*/src; then
            echo "::error::Use a CSPRNG: random_int, or node:crypto randomInt."
            exit 1
          fi

      # C# keeps its sources under the project directory, so the src/ globs
      # above do not reach it.
      - name: Reject predictable randomness in C#
        run: |
          TARGET=packages/dotnet/Kampe.TelegramTwoFactor
          if grep -rnE 'new Random\(|Random\.(Shared|Next)' --include='*.cs' "$TARGET"; then
            echo "::error::Use RandomNumberGenerator. System.Random is not cryptographic, so its output is predictable from prior samples."
            exit 1
          fi

      - name: Reject non-constant-time comparison of code material in C#
        run: |
          TARGET=packages/dotnet/Kampe.TelegramTwoFactor
          if grep -rnE '(storedHash|expected)[[:space:]]*={2}[[:space:]]*(actual|Hash\()' --include='*.cs' "$TARGET"; then
            echo "::error::Compare code hashes with CryptographicOperations.FixedTimeEquals, not ==."
            exit 1
          fi

      - name: Reject logging a code in C#
        run: |
          TARGET=packages/dotnet/Kampe.TelegramTwoFactor
          if grep -rniE '(_log|logger)\.[A-Za-z]+\([^)]*"code"\]?[[:space:]]*=[^=]' --include='*.cs' "$TARGET"; then
            echo "::error::A verification code must never be written to a log."
            exit 1
          fi
