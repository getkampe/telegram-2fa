name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: packages/php

    # A real Redis, because the adapter's central claim — that one code is
    # consumed once across processes — rests on a lock being shared between
    # them, and an in-process lock trivially is not. The integration suite
    # skips itself when REDIS_HOST is unset, so this service is what keeps it
    # from being permanently skipped.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, redis, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Lint every source file
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Test
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 15
        run: vendor/bin/phpunit

      - name: Fail if the live-store integration suite was skipped
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_DB: 15
        run: |
          # A guarantee that rests on a skipped test is not a guarantee. If
          # this suite stops running, that must break the build rather than
          # pass quietly.
          if vendor/bin/phpunit --filter RedisCacheCodeStoreTest --no-coverage | grep -qiE 'skipped|no tests'; then
            echo "::error::The live Redis integration suite did not run."
            exit 1
          fi

  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.21', '1.22', '1.23']
    defaults:
      run:
        working-directory: packages/go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: packages/go/go.sum

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change: $unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test under the race detector
        # The strongest concurrency check in the repository, and the reason
        # this job exists in addition to `go test`: the detector reports
        # unsynchronised access directly, rather than waiting for a bad
        # interleaving to happen to occur.
        run: go test -race ./...

  # The protocol is only worth having if nothing leaks the thing it protects.
  # This fails the build on the mistakes that are easiest to reintroduce.
  secrets-hygiene:
    name: No codes in logs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject logging a raw update body
        run: |
          if grep -rniE "log[^(]*\(.*(update|request)->all\(\)" \
               --include='*.php' --include='*.ts' packages/*/src; then
            echo "::error::A raw Telegram update must never be logged: it contains the codes."
            exit 1
          fi

      - name: Reject logging a code
        run: |
          if grep -rniE "(log|console)[^(]*\([^)]*['\"]code['\"][[:space:]]*(=>|:)" \
               --include='*.php' --include='*.ts' packages/*/src; then
            echo "::error::A verification code must never be written to a log."
            exit 1
          fi

      - name: Reject non-constant-time comparison of code material
        run: |
          if grep -rnE '[$](storedHash|storedCode|hash|code)[[:space:]]*={2,3}[[:space:]]*[$]' \
               --include='*.php' packages/*/src; then
            echo "::error::Compare code hashes with hash_equals, not == or ===."
            exit 1
          fi

      - name: Reject predictable randomness
        run: |
          if grep -rnE '(mt_rand|[^_a-z]rand)[[:space:]]*\(|Math\.random[[:space:]]*\(' \
               --include='*.php' --include='*.ts' packages/*/src; then
            echo "::error::Use a CSPRNG: random_int, or node:crypto randomInt."
            exit 1
          fi

      - name: Reject Go's seeded random
        run: |
          # math/rand in a security path is the same mistake as mt_rand: a
          # seeded generator's output is predictable from prior samples.
          if grep -rn '"math/rand"' --include='*.go' packages/go; then
            echo "::error::Use crypto/rand, not math/rand."
            exit 1
          fi
